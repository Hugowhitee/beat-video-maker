name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/vertical-slice]
  pull_request:

permissions:
  contents: read

concurrency:
  group: beatvideo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Beatvideo-Visual-QA
          path: artifacts/visual-qa/**
          if-no-files-found: warn
          retention-days: 7
