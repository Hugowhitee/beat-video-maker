name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/vertical-slice]
  pull_request:

permissions:
  contents: write

concurrency:
  group: beatvideo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Detect lockfile
        id: lockfile
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ steps.lockfile.outputs.present }}" == "true" ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci --no-audit --no-fund
          fi

      - name: Bootstrap package lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/vertical-slice' && steps.lockfile.outputs.present == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock npm dependencies"
          git push

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check
        run: npm run check

      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Beatvideo-Visual-QA
          path: artifacts/visual-qa/**
          if-no-files-found: warn
          retention-days: 7
