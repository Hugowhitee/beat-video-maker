name: Branch hygiene

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged short-lived branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const durable = new Set([
              'main',
              'migration/freecut-upstream',
              'upstream/freecut',
            ])

            if (durable.has(branch)) {
              core.notice(`Keeping durable branch ${branch}`)
              return
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              })
              core.notice(`Deleted merged branch ${branch}`)
            } catch (error) {
              if (error.status === 404) {
                core.notice(`Branch ${branch} was already deleted`)
                return
              }
              throw error
            }
