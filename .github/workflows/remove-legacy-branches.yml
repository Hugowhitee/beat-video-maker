name: Remove legacy branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete migration refs
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'migration/freecut-upstream',
              'upstream/freecut',
            ]

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                })
                core.notice(`Deleted ${branch}`)
              } catch (error) {
                if (error.status === 404) {
                  core.notice(`${branch} already absent`)
                  continue
                }
                throw error
              }
            }
