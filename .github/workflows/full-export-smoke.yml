name: Full export smoke

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Sustained export duration in seconds
        required: true
        default: "120"

permissions:
  contents: read

jobs:
  full-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate duration
        shell: bash
        env:
          DURATION: ${{ inputs.duration_seconds }}
        run: |
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]] || (( DURATION < 30 || DURATION > 300 )); then
            echo "duration_seconds must be an integer between 30 and 300"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run sustained production export
        env:
          FULL_EXPORT_SECONDS: ${{ inputs.duration_seconds }}
        run: npm run test:full-export
