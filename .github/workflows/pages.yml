name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beatvideo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true

      - uses: actions/configure-pages@v5

      - run: vp install

      - name: Build Beatvideo Maker for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: vp build

      - name: Add SPA fallback and validate project paths
        run: |
          cp dist/index.html dist/404.html
          node scripts/check-pages-output.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Beatvideo Maker
        id: deployment
        uses: actions/deploy-pages@v4
